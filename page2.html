<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제3의학연구원 안내</title>

<style>
:root {
  --navy:#061f43;
  --navy2:#0a3568;
  --gold:#c9a45a;
  --gold2:#f4dfa2;
  --paper:#fffdfa;
  --line:#d7bf76;
  --text:#111827;
}

* { box-sizing:border-box; }

body {
  margin:0;
  min-height:100svh;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
  color:var(--text);
  background:radial-gradient(circle at 50% 0%, #174f88 0%, #082f5f 42%, #031832 100%);
  display:grid;
  place-items:center;
  padding:clamp(12px,3.5vw,40px);
}

.page { width:min(100%, 840px); }

.top-title {
  color:var(--gold2);
  text-align:center;
  font-size:clamp(18px,4.8vw,34px);
  font-weight:900;
  margin:0 0 clamp(14px,3.2vw,26px);
}

.card {
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,253,248,.99));
  border-radius:clamp(24px,5vw,44px);
  padding:clamp(18px,4.2vw,48px);
}

.brand {
  display:grid;
  grid-template-columns:120px 1fr;
  gap:20px;
  align-items:center;
  margin-bottom:30px;
}

.logo { width:100%; border-radius:50%; }

.brand-name {
  font-size:clamp(18px,4.7vw,36px);
  font-weight:950;
  color:var(--navy);
}

.row {
  display:grid;
  grid-template-columns:60px 1fr;
  gap:20px;
  padding:18px 0;
  border-bottom:1px solid var(--line);
}

.icon {
  width:60px;
  height:60px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:var(--navy);
  color:#fff;
  font-size:26px;
}

/* ⭐ LH-277 */
.product-code {
  display:inline-block;
  margin-bottom:6px;
  padding:4px 14px;
  border-radius:999px;
  background:linear-gradient(135deg,#fffdf5,#f4dfa2);
  border:1px solid rgba(201,164,90,.7);
  font-weight:900;
  font-size:clamp(16px,4.5vw,22px);
  letter-spacing:0.05em;
}

h2 {
  margin:4px 0;
  font-size:clamp(18px,4.5vw,28px);
  color:var(--navy);
}

p,.phone {
  font-size:clamp(14px,3.5vw,22px);
  margin:0;
}

/* ⭐ 전화 빨간색 */
.phone::before {
  content:"☎ ";
  color:#d60000;
}

.phone {
  display:block;
  text-decoration:none;
  color:#000;
}

.bottom {
  text-align:center;
  color:var(--gold2);
  margin-top:20px;
}
</style>
</head>

<body>

<div class="page">

<h1 class="top-title">
獨資企業 : 沈陽市杏林中醫藥研究所
</h1>

<div class="card">

<img class="logo" src="logo.png">
<div class="brand-name">
(주) 제3의학연구원<br>
(주) 한국신물질연구소
</div>
</div>

<div class="row">
<div class="icon">◎</div>
<div>

<p>제3의학연구원 기술 감독 제작품</p>
</div>
</div>

<div class="row">

<div>
<h2>운영 안내</h2>
<p>본사 독점 소비자 및 해외 상담 관리처</p>
</div>
</div>

<div class="row">
<div class="icon">◆</div>
<div>
<div class="product-code">[LH-277]</div>
<h2>개발 책임자</h2>
<p>채일규 개발 제3 의학자</p>
</div>
</div>

<div class="row">
<div class="icon">☎</div>
<div>
<h2>대표번호</h2>
<a class="phone" href="tel:+8228430000">+82-2-843-0000</a>

<h2>상담문의</h2>
<a class="phone" href="tel:+821087290001">+82-10-8729-0001</a>
<a class="phone" href="tel:+821037950000">+82-10-3795-0000</a>
</div>
</div>

<div class="row" style="border-bottom:0;">
<div class="icon">⌖</div>
<div>

</div>

<div class="bottom">THE 3RD MEDICAL INSTITUTE</div>

</div>

</body>
</html>
