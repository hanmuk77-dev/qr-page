<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제3의학연구원 안내</title>
<style>
:root {
  --navy:#061f43;
  --navy2:#0a3568;
  --gold:#c9a45a;
  --gold2:#f4dfa2;
  --paper:#fffdfa;
  --line:#d7bf76;
  --text:#111827;
}
* { box-sizing:border-box; }
html {
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
}
body {
  margin:0;
  min-height:100svh;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Arial,sans-serif;
  color:var(--text);
  background:radial-gradient(circle at 50% 0%, #174f88 0%, #082f5f 42%, #031832 100%);
  display:grid;
  place-items:center;
  padding:clamp(12px,3.5vw,40px);
}
.page {
  width:min(100%, 840px);
}
.top-title {
  color:var(--gold2);
  text-align:center;
  font-size:clamp(18px,4.8vw,34px);
  font-weight:900;
  letter-spacing:-0.035em;
  line-height:1.3;
  margin:0 0 clamp(14px,3.2vw,26px);
  text-shadow:0 2px 10px rgba(0,0,0,.35);
  word-break:keep-all;
}
.top-line {
  height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  margin:0 auto clamp(8px,1.8vw,14px);
  width:78%;
}
.card {
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,253,248,.99));
  border:1px solid rgba(244,223,162,.75);
  border-radius:clamp(24px,5vw,44px);
  padding:clamp(18px,4.2vw,48px);
  box-shadow:0 24px 58px rgba(0,0,0,.36), inset 0 0 0 1px rgba(255,255,255,.8);
}
.card::before {
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  pointer-events:none;
  box-shadow:inset 0 0 0 3px rgba(201,164,90,.38);
}
.brand {
  display:grid;
  grid-template-columns:clamp(78px,20vw,165px) 1fr;
  gap:clamp(14px,4vw,34px);
  align-items:center;
  padding:clamp(8px,2vw,16px) 0 clamp(20px,4.2vw,36px);
  border-bottom:1px solid rgba(201,164,90,.58);
  margin-bottom:clamp(18px,4vw,34px);
}
.logo-wrap {
  display:grid;
  place-items:center;
  padding:clamp(5px,1.5vw,12px);
  border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#f8f8f8 58%,#f1e6c8 100%);
  box-shadow:0 12px 24px rgba(0,0,0,.17), inset 0 0 0 2px rgba(201,164,90,.9);
}
.logo {
  width:100%;
  height:auto;
  display:block;
  border-radius:50%;
}
.brand-text-grid {
  display:grid;
  grid-template-columns:2px 1fr;
  gap:clamp(14px,3.8vw,28px);
  align-items:center;
}
.brand-divider {
  width:2px;
  align-self:stretch;
  background:linear-gradient(180deg,transparent,var(--gold),transparent);
}
.brand-name {
  color:var(--navy);
  font-size:clamp(18px,4.7vw,36px);
  font-weight:950;
  line-height:1.42;
  letter-spacing:-0.06em;
  word-break:keep-all;
}
.rows {
  display:grid;
}
.row {
  display:grid;
  grid-template-columns:clamp(44px,10.5vw,72px) 1fr;
  gap:clamp(14px,3.7vw,28px);
  align-items:center;
  padding:clamp(12px,3vw,22px) 0;
  border-bottom:1px solid rgba(201,164,90,.45);
}
.row:last-child {
  border-bottom:0;
  padding-bottom:0;
}
.icon {
  width:clamp(44px,10.5vw,72px);
  height:clamp(44px,10.5vw,72px);
  border-radius:50%;
  display:grid;
  place-items:center;
  background:radial-gradient(circle at 35% 30%,#174f88,#061f43 74%);
  color:var(--gold2);
  font-size:clamp(20px,5.2vw,34px);
  font-weight:900;
  box-shadow:0 6px 14px rgba(0,0,0,.22), inset 0 0 0 2px var(--gold);
  flex:none;
}
.kicker {
  color:#9b7626;
  font-size:clamp(10px,2.3vw,14px);
  font-weight:850;
  letter-spacing:.08em;
  margin-bottom:clamp(2px,.8vw,5px);
}
.product-code {
  display:inline-block;
  margin:0 0 clamp(6px,1.4vw,10px);
  padding:clamp(3px,.8vw,6px) clamp(10px,2.5vw,16px);
  border-radius:999px;
  background:linear-gradient(135deg,#fffdf5,#f4dfa2);
  border:1px solid rgba(201,164,90,.75);
  color:var(--navy);
  font-size:clamp(14px,3.7vw,20px);
  font-weight:900;
  letter-spacing:.04em;
  line-height:1.25;
  box-shadow:0 3px 8px rgba(0,0,0,.08);
}

h2 {
  margin:0 0 clamp(3px,.9vw,7px);
  color:var(--navy);
  font-size:clamp(16px,4.2vw,28px);
  font-weight:950;
  line-height:1.28;
  letter-spacing:-0.055em;
  word-break:keep-all;
}
p, .phone {
  margin:0;
  color:#111;
  font-size:clamp(14px,3.55vw,22px);
  line-height:1.58;
  letter-spacing:-0.04em;
  word-break:keep-all;
}
.phone-box {
  display:grid;
  grid-template-columns:minmax(94px,.42fr) 1fr;
  gap:clamp(6px,1.6vw,12px) clamp(14px,3.6vw,30px);
  align-items:baseline;
}
.phone-label {
  color:var(--navy);
  font-size:clamp(16px,4.1vw,28px);
  font-weight:950;
  letter-spacing:-0.055em;
  line-height:1.28;
  word-break:keep-all;
}
.phone {
  display:inline-block;
  white-space:nowrap;
  text-decoration:none;
  padding:.05em 0;
}
.phone::before {
  content:"☎ ";
  color:#d60000;
}
.phone:active {
  color:var(--navy);
  transform:scale(.99);
}
.bottom-brand {
  color:var(--gold2);
  text-align:center;
  margin-top:clamp(14px,3.5vw,26px);
  font-size:clamp(10px,2.5vw,15px);
  letter-spacing:.2em;
  font-weight:700;
}
@media (max-width:430px) {
  body { padding:12px; }
  .brand {
    grid-template-columns:74px 1fr;
    gap:13px;
  }
  .brand-text-grid {
    gap:13px;
  }
  .row {
    grid-template-columns:42px 1fr;
    gap:13px;
  }
  .icon {
    width:42px;
    height:42px;
    font-size:21px;
  }
  .phone-box {
    grid-template-columns:1fr;
    row-gap:1px;
  }
  .phone-label:nth-of-type(2) {
    margin-top:7px;
  }
}
@media (max-width:360px) {

  .product-code {
    font-size:clamp(13px,3.6vw,17px);
    padding:3px 10px;
  }
  .top-title { font-size:clamp(16px,5vw,22px); }
  .brand-name { font-size:clamp(16px,4.8vw,20px); }
  h2,.phone-label { font-size:clamp(15px,4.3vw,18px); }
  p,.phone { font-size:clamp(13px,3.8vw,16px); }
}
@media (orientation:landscape) and (max-height:700px) {

  .product-code {
    font-size:15px;
    padding:3px 9px;
    margin-bottom:3px;
  }
  body { align-items:start; padding:10px; }
  .page { width:min(100%, 1050px); }
  .top-title {
    font-size:clamp(18px,3.8vw,30px);
    margin-bottom:10px;
  }
  .top-line { margin-bottom:7px; }
  .card {
    padding:18px 30px;
    border-radius:28px;
  }
  .brand {
    grid-template-columns:88px 1fr;
    gap:22px;
    padding-bottom:16px;
    margin-bottom:14px;
  }
  .brand-name {
    font-size:clamp(20px,3.2vw,30px);
    line-height:1.32;
  }
  .row {
    grid-template-columns:48px 1fr;
    gap:18px;
    padding:8px 0;
  }
  .icon {
    width:48px;
    height:48px;
    font-size:24px;
  }
  .kicker { display:none; }
  h2, .phone-label {
    font-size:clamp(17px,2.8vw,24px);
  }
  p, .phone {
    font-size:clamp(15px,2.5vw,20px);
    line-height:1.4;
  }
  .phone-box {
    grid-template-columns:116px 1fr;
    row-gap:3px;
  }
  .bottom-brand { display:none; }
}
</style>
</head>
