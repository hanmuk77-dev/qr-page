<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제3의학연구원</title>

<style>
html, body{
  margin:0;
  padding:0;
  background:#000;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* 컨테이너 */
.wrap{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:10px; /* 안전 여백 */
  box-sizing:border-box;
}

/* 이미지 */
img{
  max-width:100%;
  max-height:100%;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
}
</style>
</head>

<body>

<div class="wrap">
  <img src="lending.png" alt="landing">
</div>

</body>
</html>
